<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>探索者身份驗證｜心中有數</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="space-background"></div>

    <header class="site-header">
      <a class="logo" href="index.html">
        <span class="logo-core">數</span>
        <span>
          心中有數
          <small>MATH UNIVERSE</small>
        </span>
      </a>

      <nav>
        <a href="index.html">首頁</a>
        <a href="leaderboard.html">排行榜</a>
        <button data-sound-toggle type="button">🔇</button>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-intro">
        <p class="system-label">
          EXPLORER IDENTIFICATION
        </p>

        <h1>
          登上你的<br />
          <span>數學探索號</span>
        </h1>

        <p>
          建立探索者帳戶後，系統將分配一艘專屬飛船。
          你的進度、分數及飛船經驗會永久保存。
        </p>

        <ul class="status-list">
          <li>每題只能正式提交一次</li>
          <li>答對一題獲得 5 分</li>
          <li>每次探索取得飛船 XP</li>
          <li>完成星球解鎖新航線</li>
        </ul>
      </section>

      <section class="auth-panel brutal-panel">
        <div class="auth-tabs">
          <button id="showLogin" class="active" type="button">
            登入
          </button>

          <button id="showRegister" type="button">
            建立帳戶
          </button>
        </div>

        <form id="loginForm">
          <p class="panel-code">
            ACCESS // EXISTING EXPLORER
          </p>

          <label for="loginEmail">電郵地址</label>
          <input id="loginEmail" type="email" required />

          <label for="loginPassword">密碼</label>
          <input
            id="loginPassword"
            type="password"
            minlength="6"
            required
          />

          <button class="game-button cyan full" type="submit">
            登上探索飛船
          </button>
        </form>

        <form id="registerForm" hidden>
          <p class="panel-code">
            REGISTER // NEW EXPLORER
          </p>

          <label for="displayName">探索者名稱</label>
          <input
            id="displayName"
            type="text"
            maxlength="20"
            required
          />

          <label for="registerEmail">電郵地址</label>
          <input
            id="registerEmail"
            type="email"
            required
          />

          <label for="registerPassword">密碼</label>
          <input
            id="registerPassword"
            type="password"
            minlength="6"
            required
          />

          <label for="confirmPassword">確認密碼</label>
          <input
            id="confirmPassword"
            type="password"
            minlength="6"
            required
          />

          <button class="game-button pink full" type="submit">
            建立探索者與飛船
          </button>
        </form>

        <p id="authMessage" class="message"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
