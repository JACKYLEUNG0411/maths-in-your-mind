<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>練習任務｜Maths in Your Mind</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="practice-page">

    <header class="practice-header">
      <a href="levels.html">
        ← 返回星球地圖
      </a>

      <h1 id="levelName">
        載入中……
      </h1>

      <p id="levelDescription"></p>

      <div class="practice-progress">
        <span id="progressText">
          題目載入中……
        </span>

        <div class="progress-track">
          <div
            id="progress"
            class="progress-bar"
            style="width: 0%;"
          ></div>
        </div>
      </div>
    </header>

    <section class="question-card">

      <div class="question-meta">
        <span id="questionNumber"></span>
        <span id="zoneName"></span>
        <span id="topic"></span>
        <span id="difficulty"></span>
        <span id="points"></span>
      </div>

      <p id="zoneDescription"></p>

      <h2 id="questionTitle">
        載入題目中……
      </h2>

      <div
        id="questionText"
        class="question-text"
      ></div>

      <div class="hint-box">
        <strong>提示：</strong>
        <span id="hintText">
          載入中……
        </span>
      </div>
    </section>

    <section class="answer-card">

      <label for="answerInput">
        請輸入你的答案
      </label>

      <input
        id="answerInput"
        type="text"
        autocomplete="off"
        placeholder="例如：510、3:4、1.6 km"
      >

      <button
        id="submitAnswer"
        type="button"
      >
        提交答案
      </button>

      <div
        id="answerMessage"
        class="answer-message"
        hidden
      ></div>

      <div class="result-area">

        <p>
          正確答案：
          <strong id="correctAnswer"></strong>
        </p>

        <p>
          本題得分：
          <strong id="score"></strong>
        </p>

        <p>
          XP：
          <strong id="xp"></strong>
        </p>

        <div id="solutionText"></div>

      </div>
    </section>

    <nav class="question-navigation">

      <button
        id="previousQuestion"
        type="button"
      >
        上一題
      </button>

      <button
        id="nextQuestion"
        type="button"
      >
        下一題
      </button>

    </nav>

    <div
      id="loading"
      class="loading-message"
    >
      載入中……
    </div>

    <div
      id="completedMessage"
      class="completed-message"
      hidden
    ></div>

  </main>

  <!-- 必須先載入 Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- config.js 必須先於 practice.js -->
  <script src="config.js"></script>

  <!-- 如果你的專案有 common.js，可以保留 -->
  <script src="common.js"></script>

  <!-- 最後才載入 practice.js -->
  <script src="practice.js?v=3"></script>
</body>
</html>
